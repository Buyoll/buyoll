<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Buyoll - Social fintech e-commerce platform with Chama group savings, featured deals, newly posted announcements, immediate group activation, manual M-Pesa Till payments, and peer loans." />
    <meta property="og:title" content="Buyoll - Social Fintech Chama Marketplace" />
    <meta property="og:description" content="Buyoll - Social fintech e-commerce platform with Chama group savings, featured deals, newly posted announcements, immediate group activation, manual M-Pesa Till payments, and peer loans." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./buyoll_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Gracefully prevent unhandled WebSocket dev reconnection errors in AI Studio iframe
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason.message || event.reason).includes('WebSocket') ||
          event.reason.name === 'WebSocketClosedError'
        )) {
          event.preventDefault();
        }
      });

      // Initialize Buyoll Dark/Light Theme instantly to prevent flicker
      (function() {
        try {
          var theme = localStorage.getItem('buyoll_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
