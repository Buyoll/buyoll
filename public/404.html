<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buyoll - Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Preserves deep links and routes back to the app entry point
      (function() {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var repo = (segments.length > 0 && segments[0] === 'buyoll') ? '/buyoll/' : '/';
        // Redirect to base index.html keeping search query and hash
        window.location.replace(repo + (window.location.search || '') + (window.location.hash || ''));
      })();
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0; url=./" />
    </noscript>
    <p>Redirecting to <a href="./">Buyoll Marketplace</a>...</p>
  </body>
</html>
