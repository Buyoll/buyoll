<style>

.btn.alt{background:var(--btn);color:#fff}.btn.ghost{background:none;border:1.5px solid var(--leafink);color:var(--leafink)}.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}.btn.block{display:block;width:100%}

.tabs a{flex:1;text-align:center;padding:12px 0;min-height:48px;font-size:14px;text-decoration:none;color:var(--mute);border-top:3px solid transparent}.tabs a.on{color:var(--leafink);font-weight:700;border-top-color:var(--leafink)}}

.logo{display:inline-flex;align-items:center}.logo svg{height:34px;width:34px;margin:0 1px}

.wrap{max-width:1440px;padding:0 24px}.sec{font-size:24px;margin:32px 0 6px}.btn{background:#FF6A00;color:#fff}.card .btn.alt{background:#FF6A00}
.search{max-width:720px}.search input{min-height:46px;font-size:15px}.cats a{font-size:14px}.cats a:hover{background:var(--leaf)}

.hv .pic{aspect-ratio:1/1;max-height:340px;margin:auto;border-radius:16px;background-color:#faf6ec}.hv .pic.ph{background:#eef1f0}.dots{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px}
.how div{display:flex;gap:12px;align-items:flex-start;padding:18px}.ic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--leaf);color:var(--leafink);display:grid;place-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:0}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.wrap{padding:0 14px}.hero{padding:22px}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .pic.ph{background:var(--line)}}
.hero{grid-template-columns:1fr;min-height:0;gap:16px}.fstrip{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 0}.fstrip::-webkit-scrollbar{display:none}

</style></head>
<body><div id="app"></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kes=n=>'KSh '+Number(n).toLocaleString('en-KE'), daily=(p,n)=>Math.ceil(p/n/10), CYC=10,SIZES=[10,8,6,4,3,2],FEE=50,PTILL='000000',DAY=864e5;
const MC=`<svg class="mc" viewBox="0 0 34 34" aria-hidden="true"><path d="M1 3h4l2 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 25V9l8 10 8-10v16" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 25h18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle class="d" cx="15" cy="5" r="2.6" fill="#fff"/><circle class="w" cx="10" cy="30" r="2.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="3 2.1"/><circle class="w" cx="22" cy="30" r="2.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="3 2.1"/></svg>`;
const CATS=['Phones, Tablets & TV','Appliances','Home & Office Furniture','Bedding','Kitchen','Gaming','Fashion','Computing','Baby'];
let mem=null;
function load(){try{const r=localStorage.getItem('chamall5');if(r)return JSON.parse(r)}catch(e){}return mem}
function save(){try{localStorage.setItem('chamall5',JSON.stringify(D))}catch(e){mem=D}}
const CS=new Set(),AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){for(;;){const n=5+crypto.getRandomValues(new Uint8Array(1))[0]%6,c=Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>AL[x&31]).join('');if(!CS.has(c)){CS.add(c);return c}}}
function slots(n){return Array.from({length:n},(_,i)=>({n:i+1,uid:null,ref:null,status:'open',paid:0}))}
function seed(){
 const now=Date.now(),P=[['JP Sufuria Set (10 pcs)',5300,'🍲',28,'Kitchen','Stainless steel sufuria set with lids. Nests to save space.',0,10],['Hot & Cold Water Dispenser',8900,'🚰',200,'Appliances','Standing dispenser with child lock and cabinet.',0,0],['Cotton Duvet 6x6 (4 in 1)',4200,'🛏️',265,'Bedding','Soft duvet with sheets and pillowcases.',1,0],['5-Seater Sofa Set',42000,'🛋️',18,'Home & Office Furniture','Fabric sofa set, 3+1+1, wooden frame.',2,15],['Microwave Oven 20L',11500,'📟',215,'Appliances','Digital microwave with 5 power levels.',3,0],['Non-stick Cookware (12 pcs)',7800,'🍳',8,'Kitchen','Non-stick pots and pans with heat-safe handles.',5,0],['Smartphone 6.5in 128GB',15500,'📱',150,'Phones, Tablets & TV','Dual SIM, 5000mAh battery.',9,20],['Electric Blender 1.5L',3600,'🥤',95,'Appliances','400W blender with grinder jar.',12,0]];
 const U=['Wanjiku','Otieno','Achieng','Kamau','Zawadi','Mwangi'].map((n,i)=>({id:i+1,name:n,code:n.toUpperCase(),credit:0,role:'buyer',coins:50,pts:[120,40,260,0,75,10][i],last:now-(i==5?5:0)*DAY,phone:'07000000'+i}));
 U.push({id:7,name:'ChaMall Admin',code:'ADMIN',credit:0,role:'admin',pts:0,last:now,phone:'0700000000'},{id:8,name:'Mama Home Store',shop:'Mama Home Store',code:'MAMA',credit:0,role:'merchant',verified:true,pts:0,last:now,phone:'0711111111'});
 const d={users:U,products:P.map((p,i)=>({id:i+1,t:p[0],price:Math.round(p[1]*(100-p[7])/100),was:p[7]?p[1]:0,disc:p[7],e:p[2],hue:p[3],cat:p[4],blurb:p[5],m:8,live:true,pub:1,feat:[0,3,6].includes(i),exp:now+(30-p[6])*DAY,ts:now-p[6]*DAY})),groups:[],pays:[],log:[],tips:[],payouts:[],me:null,nid:100};
 d.products.forEach(p=>[[10,6],[4,2]].forEach(([size,have])=>{const a=1+Math.floor(Math.random()*6),g={id:d.nid++,pid:p.id,size,name:U[a-1].name+'’s Chama',admin:a,ok:true,started:false,slots:slots(size)};
  for(let i=0;i<have;i++)Object.assign(g.slots[i],{uid:(a-1+i)%6+1,ref:a,status:'active',code:genCode()});d.groups.push(g)}));
 return d}
let D=load()||seed(), V={v:'home',a:null,q:'',cat:'',msg:null};D.groups.forEach(g=>g.slots.forEach(x=>x.code&&CS.add(x.code)));
const me=()=>D.users.find(u=>u.id===D.me), P=id=>D.products.find(p=>p.id==id), G=id=>D.groups.find(g=>g.id==id), U=id=>D.users.find(u=>u.id===id);
const taken=g=>g.slots.filter(s=>s.status==='active').length;
const tile=(p,x='')=>p.img?`<div class="pic" style="background:#f6f6f6 center/contain no-repeat url('${p.img}');${x}"></div>`:`<div class="pic ph" style="${x}" role="img" aria-label="${esc(p.cat)}">${IC('<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 016 0"/>',48)}</div>`;
const isNew=p=>Date.now()-p.ts<7*DAY, on_=p=>p.live&&p.mod!=='pending'&&p.mod!=='returned'&&(!p.exp||Date.now()<p.exp), lv=()=>D.products.filter(on_), star=()=>{const t=D.users.filter(u=>u.pts>0).sort((a,b)=>b.pts-a.pts)[0];return t&&t.id},
 nm=u=>esc(u.name)+(star()===u.id?' ⭐':''), idle=u=>u.role==='buyer'&&Date.now()-u.last>3*DAY, dt=t=>new Date(t).toLocaleDateString('en-KE',{day:'numeric',month:'short'}),
 badges=p=>(p.feat?'<span class="pill">Featured</span>':'')+(isNew(p)?'<span class="pill dark">New</span>':'')+(p.disc?`<span class="pill red">${p.disc}% off</span>`:''),
 priceHtml=p=>kes(p.price)+(p.was?` <s class="mute">${kes(p.was)}</s>`:''), log=t=>{D.log.unshift([Date.now(),t]);D.log=D.log.slice(0,40)};
const payInfo=t=>/(\btill\b|pay\s?bill|m-?pesa|send\s?money|account\s?(no|number)|\b0[17]\d{8}\b|\+?254[17]\d{8}|buy\s?goods)/i.test(t||'');
const vis=g=>g.ok||(me()&&g.admin===me().id);
const kl=x=>({fee:'Listing fee',coins:'Coin top-up'}[x.kind]||'Chama');
const R3=[0,0,0],LAB=['Posted today','Posted yesterday','Earlier'],SUB=['Fresh offers added in the last day.','Offers announced yesterday.','More great finds from earlier this week and before.'];
const bk=()=>{const b=[[],[],[]];lv().sort((a,c)=>c.ts-a.ts).forEach(p=>b[Math.min(2,Math.floor((Date.now()-p.ts)/DAY))].push(p));return b};
const mini=p=>`<div class="mini" ${nav('product',p.id)} role="link" tabindex="0">${tile(p)}<div class="b"><b>${esc(p.t)}</b><br>${kes(p.price)}<div class="row">${badges(p)}</div></div></div>`;
const rowHtml=i=>{const l=bk()[i];if(!l.length)return '<p class="mute">Nothing posted in this period.</p>';const r=R3[i]%l.length;return [...l.slice(l.length-r),...l.slice(0,l.length-r)].map(mini).join('')};
const rolls=()=>`<h2 class="sec">Announcements</h2><p class="mute">Items stay marked “New” for 7 days. Each row rolls every 2 seconds.</p>`+[0,1,2].map(i=>`<h3 class="sh">${LAB[i]}</h3><p class="mute" style="margin:0 0 6px">${SUB[i]}</p><div class="roll" id="roll${i}">${rowHtml(i)}</div>`).join('');
setInterval(()=>{if(V.v!=='home'||V.q||V.cat)return;[0,1,2].forEach(i=>{const e=document.getElementById('roll'+i);if(e&&bk()[i].length>1){R3[i]++;e.innerHTML=rowHtml(i)}})},2000);
const IC=(d,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
let HP=0,FS=0,FA=0,FE=null;const CW=222,fl=()=>lv().filter(p=>p.feat).sort((a,b)=>b.ts-a.ts);
const stripHtml=()=>{const l=fl(),n=l.length;if(!n)return '';const w=n<=30?l.concat(l):Array.from({length:Math.min(60,n)},(_,i)=>l[(FS+i)%n]);return w.map(mini).join('')};
const heroHtml=()=>{const n=fl().length;return `<div><span class="pill dark">FEATURED DEAL</span><h1>Upgrade Your Home for Less</h1><p class="sub">Featured offers flow slowly past. Pause by hovering, or jump to any number.</p>
 ${n?`<p class="mute" style="margin:0 0 8px">Showing <b id="fcur">1</b> / 100,000 <span class="mute">(${n.toLocaleString('en-KE')} live now)</span></p><form data-form="jump" class="row"><label for="jn" class="mute">Go to item</label><input id="jn" name="n" type="number" min="1" max="100000" value="1" style="width:110px;margin:0"><button class="btn sm">Go</button></form>`:''}</div>
 <div class="fstrip" id="fstrip" aria-label="Featured deals">${stripHtml()||'<p class="mute">No featured deals yet.</p>'}</div>`};
function fflow(){const e=document.getElementById('fstrip'),n=fl().length;if(e&&n>1&&V.v==='home'&&!V.q&&!V.cat){if(e!==FE){FE=e;FA=0}
 if(!HP&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches){if(Math.abs(e.scrollLeft-FA)>3)FA=e.scrollLeft;FA+=.4;const dbl=n<=30,half=e.scrollWidth/2;
  if(dbl&&FA>=half)FA-=half;else if(!dbl&&FA+e.clientWidth>=e.scrollWidth-2){FS=(FS+30)%n;e.innerHTML=stripHtml();FA=0}e.scrollLeft=FA}
 const c=document.getElementById('fcur');if(c)c.textContent=(FS+Math.round(e.scrollLeft/CW))%n+1}requestAnimationFrame(fflow)}

const act={
 go:d=>go(d.v,d.a||null), cat:d=>{V.cat=d.c;V.q='';go('home')}, logout:()=>{D.me=null;go('home')},
 resetcode:d=>{const g=G(+d.g),s=g.slots.find(x=>x.n==d.n);s.code=genCode();say('ok','Your code was reset. Your new code: '+s.code);go('group',g.id,1)},

 gok:d=>{const g=G(+d.g);g.ok=true;log('Approved '+g.name);go('admin',null,1)},
 gno:d=>{D.groups=D.groups.filter(g=>g.id!=d.g);log('Rejected a Chama');go('admin',null,1)},

 rel:d=>{const g=G(+d.g),s=g.slots.find(x=>x.n==d.n),p=P(g.pid);s.rel=true;D.payouts.push({id:D.nid++,mid:p.m,gid:g.id,n:s.n,amt:p.price,t:Date.now()});log(`Released ${p.t} to ${U(s.uid).name}; paid ${U(p.m).shop}`);go('admin',null,1)},

 no:d=>{const x=D.pays.find(y=>y.id==d.p);x.st='rejected';log('Rejected '+x.code);go('admin',null,1)},
 ok:d=>{const x=D.pays.find(y=>y.id==d.p);x.st='approved';

  else{const g=G(x.gid),s=g.slots.find(y=>y.n==x.n),p=P(g.pid);if(s&&s.uid===x.uid){s.paid+=Math.min(x.amt,p.price-s.paid);const u=U(x.uid);u.pts+=Math.floor(x.amt/10);u.last=Date.now()}}

 pay:d=>{const g=G(d.g),p=P(g.pid),s=g.slots.find(x=>x.n==d.n),a=Math.min(daily(p.price,g.size),p.price-s.paid);if(a>0){s.paid+=a;say('ok',`Payment of ${kes(a)} confirmed and recorded.`)}go('group',g.id,1)},

 fee:f=>{const u=me(),code=f.code.trim().toUpperCase();

 coin:f=>{const u=me(),code=f.code.trim().toUpperCase(),amt=Math.round(+f.amt);
