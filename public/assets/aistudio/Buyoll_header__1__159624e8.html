<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buyoll header</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f5f5f5;--surface:#fff;--text:#333;--muted:#666;--line:#e5e5e5;--field:#f5f5f5;--orange:#ff6600;--orange-2:#ff8000;--red:#f91c3f;--red-d:#d9102f;--admin:#7c3aed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--surface:#1e1e1e;--text:#e8e8e8;--muted:#a3a3a3;--line:#333;--field:#2a2a2a;--admin:#a78bfa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--surface:#1e1e1e;--text:#e8e8e8;--muted:#a3a3a3;--line:#333;--field:#2a2a2a;--admin:#a78bfa;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;font-size:14px}
a{color:inherit;text-decoration:none}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.hdr{background:var(--surface);border-top:3px solid var(--orange);box-shadow:0 1px 0 var(--line)}

/* promo banner (admin) */
.promo{background:linear-gradient(90deg,var(--red-d),var(--red) 30%,var(--red) 70%,var(--red-d));color:#fff}
.promo .wrap{display:flex;align-items:center;justify-content:center;gap:18px;height:64px;position:relative}
.promo b{font-size:26px;font-weight:700;letter-spacing:-.3px}
.promo .big{font-size:30px;font-weight:700;color:#ffe27a}
.promo .tag{border:2px solid #fff;border-radius:999px;padding:5px 18px;font-weight:700;font-size:15px}
.promo .x{position:absolute;right:24px;top:10px;background:rgba(0,0,0,.25);border:0;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;display:grid;place-items:center}

/* main row */
.main .wrap{display:flex;align-items:center;gap:32px;height:92px}
.logo{display:block;flex:none;background:#fff;border-radius:6px;line-height:0}
.logo img{width:112px;height:76px;display:block}
.box{flex:1;display:flex;border:2px solid var(--orange);border-radius:8px;overflow:hidden;background:var(--surface);height:46px;max-width:760px;margin:0 auto}
.box svg{width:18px;height:18px;margin:0 8px 0 14px;align-self:center;color:var(--muted)}
.box input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;color:var(--text);outline:none}
.box input::placeholder{color:var(--muted)}
.box button{border:0;background:var(--orange-2);color:#fff;font:inherit;font-weight:700;font-size:15px;letter-spacing:.5px;padding:0 38px;cursor:pointer}
.box:focus-within{box-shadow:0 0 0 3px rgba(255,102,0,.25)}
.cta{background:var(--orange);color:#fff;border:0;border-radius:8px;height:46px;padding:0 24px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.cta:hover{background:var(--orange-2)}

/* primary nav */
.nav{background:var(--field);border-top:1px solid var(--line)}
.nav .wrap{display:flex;height:46px;align-items:stretch;overflow-x:auto}
.nav a{display:flex;align-items:center;gap:8px;padding:0 22px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
.nav a:hover{color:var(--orange)}
.nav a.on{color:var(--orange);border-color:var(--orange);background:var(--surface)}

/* admin overlay (demo only) */
.bar{max-width:1280px;margin:16px auto;padding:0 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.bar label{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--text)}
.bar button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:6px;padding:5px 12px;cursor:pointer}
[data-admin]{position:relative}
body.adm [data-admin]{outline:2px dashed var(--admin);outline-offset:-2px}
body.adm [data-admin]::after{content:"Admin: " attr(data-admin);position:absolute;top:0;left:0;background:var(--admin);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:0 0 4px 0;z-index:5;pointer-events:none;white-space:nowrap}

@media (max-width:760px){
 .main .wrap{flex-wrap:wrap;height:auto;padding:10px 24px;gap:12px}.box{order:3;flex-basis:100%;max-width:none}.logo{margin-right:auto}
 .promo b,.promo .big{font-size:18px}.promo .tag{display:none}
}
</style>
</head>
